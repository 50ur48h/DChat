# Deploy to Azure (plan §4.2, WP12.2).
#
# **No secret in this file, and none in its logs.** Authentication is GitHub's
# OIDC token exchanged for an Azure one against the `dataagent-github-oidc` app
# registration's federated credential for `repo:50ur48h/DChat:environment:dev`.
# There is no service-principal password to rotate, and `permissions:
# id-token: write` is what makes the exchange possible — remove it and every job
# here fails at login rather than falling back to something weaker.
#
# **Manual only, for now.** Plan §4.2 sketches `push: { branches: [main] }`, and
# that is deliberately not enabled yet: every merge would deploy, and this
# pipeline has never run. `workflow_dispatch` first, the push trigger once dev
# has come up cleanly more than once. The line is commented rather than absent so
# the decision is visible.
#
# **Only `dev` exists** (DECISIONS **D-041**). The `deploy-prod` job §4.2
# describes is not written here rather than written and disabled: a job nobody
# can run is a job nobody maintains, and prod arrives with its own work package.
name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Defaults to this commit's sha."
        required: false
        type: string
  # push: { branches: [main] }   # enable once dev has deployed cleanly twice

# The whole security model of this file. `contents: read` is the least that lets
# a checkout work; `id-token: write` is what mints the OIDC assertion.
permissions:
  id-token: write
  contents: read

# One deploy at a time. Two overlapping runs would race on the same revision and
# the migration job below, and the loser would be deciding the schema.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    # Holds AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID,
    # POSTGRES_ADMIN_PASSWORD and BUDGET_ALERT_EMAIL. The last is a personal
    # address and this repository is public, which is why it is an environment
    # secret and not a parameter file (see infra/params/dev.bicepparam).
    environment: dev
    env:
      RESOURCE_GROUP: rg-dataagent-dev
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      # **Fail before touching Azure if a required variable is empty.**
      # `check_env.sh` proves the *template* sets a name; nothing proved the
      # name had a value. `OIDC_AUTHORITY` was believed added and was not, so
      # the template dutifully set it to an empty string, the deploy went green,
      # and the API refused every authenticated request — a value-level version
      # of the same omission the guard exists for. Ten seconds here beats a
      # fifteen-minute round trip and a 500 in a browser.
      - name: Check the deployment has what it needs
        env:
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_ENTRA_AUTHORITY: ${{ vars.NEXT_PUBLIC_ENTRA_AUTHORITY }}
          NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ENTRA_CLIENT_ID }}
          NEXT_PUBLIC_API_SCOPE: ${{ vars.NEXT_PUBLIC_API_SCOPE }}
        run: |
          missing=''
          for name in OIDC_AUTHORITY OIDC_AUDIENCE POSTGRES_ADMIN_PASSWORD \
            BUDGET_ALERT_EMAIL OPENAI_API_KEY NEXT_PUBLIC_ENTRA_AUTHORITY \
            NEXT_PUBLIC_ENTRA_CLIENT_ID NEXT_PUBLIC_API_SCOPE; do
            # **`${!name}`, bash's indirect expansion.** The first spelling of
            # this line was `eval "value=${${$name}}"`, which is a *parse* error
            # — the shell rejects `${${...}}` before `eval` is ever reached — so
            # the step died with `bad substitution` on a deployment where all
            # eight values were present and correct. See B-128: a check that
            # fails for a reason unrelated to what it checks, in the step whose
            # entire job is to tell the difference.
            value=${!name}
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Empty in the dev environment:$missing" >&2
            echo "Secrets are secrets/, variables are vars/ — a value set in the wrong" >&2
            echo "place reads as empty here and deploys an app that refuses requests." >&2
            exit 1
          fi
          echo "Every required secret and variable has a value."

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # **what-if before create, every time.** It is the cheapest possible
      # review of a template against the subscription it is about to change, it
      # costs seconds, and it is the step that turns "14 resources will be
      # created" from an assumption into a line in the log. It does not gate the
      # deploy — reading it is a person's job — but an unreadable plan here is a
      # deploy worth stopping by hand.
      - name: What the deployment would change
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam

      # **Phase 1 — infrastructure only.** `deployApps=false` and
      # `deployJobs=false`, because neither can start before the vault holds what
      # they read, and the vault does not exist until this deployment creates it.
      # That circularity is what made the first deploy impossible before WP12.2
      # added these flags: there was no moment at which the secrets could be
      # written.
      - name: Deploy the infrastructure
        id: infra
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
        run: |
          az deployment group create             --name "infra-${IMAGE_TAG:0:12}"             --resource-group "$RESOURCE_GROUP"             --template-file infra/main.bicep             --parameters infra/params/dev.bicepparam             --parameters deployApps=false deployJobs=false             --query properties.outputs -o json > outputs.json
          # Read back rather than reconstructed: the registry and vault names
          # carry a `uniqueString` suffix, so anything that guessed them here
          # would be right until the resource group changed.
          {
            echo "registry=$(jq -r .registryLoginServer.value outputs.json)"
            echo "key_vault=$(jq -r .keyVaultName.value outputs.json)"
            echo "api_url=$(jq -r .apiUrl.value outputs.json)"
          } >> "$GITHUB_OUTPUT"

      # **Phase 2 — the vault, before anything reads it.**
      - name: Seed the vault
        run: bash ops/scripts/deploy_seed_secrets.sh
        env:
          KEY_VAULT: ${{ steps.infra.outputs.key_vault }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

      # **Built on the runner with BuildKit, then pushed.** `az acr build` was the
      # first choice and it cannot run this Dockerfile: ACR Tasks uses the classic
      # Docker builder, and `apps/api/Dockerfile` uses `RUN --mount=` for uv's
      # cache and the lockfile bind — BuildKit-only syntax. The first real attempt
      # died at step 5 of 42 with `the --mount option requires BuildKit`. The
      # Dockerfile is written for BuildKit and every other build of it — local,
      # CI, the compose smoke — uses BuildKit, so building it anywhere else is the
      # anomaly rather than the file being wrong.
      #
      # **What this costs, stated accurately.** The previous comment here claimed
      # the runner never holds a registry credential. That is no longer true and
      # an overstated comment is worse than an accurate weaker one: `az acr login`
      # exchanges the OIDC session already established above for a **short-lived**
      # ACR refresh token, written to this ephemeral runner's Docker config and
      # gone with it. Nothing is stored, no secret exists in this repository or in
      # the environment, and the token cannot outlive the job — but the runner does
      # hold a credential for the length of the build, and that is the honest
      # description.
      - name: Build and push the images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          registry='${{ steps.infra.outputs.registry }}'
          az acr login --name "${registry%%.*}"

          docker build \
            --target prod \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --tag "${registry}/dataagent-api:${IMAGE_TAG}" \
            apps/api
          docker push "${registry}/dataagent-api:${IMAGE_TAG}"

          # **Every NEXT_PUBLIC_* the browser needs, at build time.** They are
          # inlined into the bundle, so they are properties of the image and
          # cannot be corrected by restarting a container. The first deploy
          # passed none: the bundle pointed at http://localhost:8000 — the
          # Dockerfile's old default, which is somebody's laptop — and rendered
          # the dev sign-in card on a public URL, because the auth mode defaulted
          # to dev whenever it was unset.
          docker build \
            --target prod \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_API_URL=${{ steps.infra.outputs.api_url }}" \
            --build-arg "NEXT_PUBLIC_ENV=dev" \
            --build-arg "NEXT_PUBLIC_AUTH_MODE=entra" \
            --build-arg "NEXT_PUBLIC_ENTRA_AUTHORITY=${{ vars.NEXT_PUBLIC_ENTRA_AUTHORITY }}" \
            --build-arg "NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.NEXT_PUBLIC_ENTRA_CLIENT_ID }}" \
            --build-arg "NEXT_PUBLIC_API_SCOPE=${{ vars.NEXT_PUBLIC_API_SCOPE }}" \
            --tag "${registry}/dataagent-web:${IMAGE_TAG}" \
            apps/web
          docker push "${registry}/dataagent-web:${IMAGE_TAG}"

      # **Phase 3 — the migration job, still without the apps.** It exists now
      # because the vault has what it reads and the image it runs exists.
      - name: Create the migration job
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
        run: |
          az deployment group create             --name "job-${IMAGE_TAG:0:12}"             --resource-group "$RESOURCE_GROUP"             --template-file infra/main.bicep             --parameters infra/params/dev.bicepparam             --parameters deployApps=false deployJobs=true imageTag="$IMAGE_TAG"

      # **Migrations run before any revision serves traffic, never after.** A
      # revision started against a schema it does not expect answers requests
      # wrongly rather than failing, which is the worst of the three orderings.
      # The job also gives `dataagent_app` its login, which nothing else can:
      # the Postgres server has no public endpoint.
      - name: Migrate, and give the app role its login
        run: bash ops/scripts/deploy_migrate.sh
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          REGISTRY: ${{ steps.infra.outputs.registry }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      # **Phase 4 — now the apps.** Everything they read exists, and the schema
      # they were built against is the one in the database.
      - name: Roll the apps onto the new image
        id: apps
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
        run: |
          az deployment group create             --name "apps-${IMAGE_TAG:0:12}"             --resource-group "$RESOURCE_GROUP"             --template-file infra/main.bicep             --parameters infra/params/dev.bicepparam             --parameters deployApps=true deployJobs=true imageTag="$IMAGE_TAG"             --query properties.outputs -o json > apps-outputs.json
          echo "web_url=$(jq -r .webUrl.value apps-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke the deployment
        run: bash ops/scripts/deploy_smoke.sh
        env:
          WEB_URL: ${{ steps.apps.outputs.web_url }}
          API_URL: ${{ steps.infra.outputs.api_url }}
          EXPECT_GIT_SHA: ${{ github.sha }}
          KEY_VAULT: ${{ steps.infra.outputs.key_vault }}
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}

      # **What the smoke above cannot ask.** `deploy_smoke.sh` runs on this
      # runner, authenticated as the OIDC deploy identity — so every question it
      # asks about a resource is answered with *that* identity's permissions. A
      # vault write from here would have succeeded throughout the entire period
      # the app identity held a read-only role (B-125), and reported a working
      # deployment while registering a data source was impossible.
      #
      # This step starts a job that runs **as the app**, and it is the only thing
      # in the pipeline that exercises Key Vault write/delete and Blob
      # write/read at all. Last, deliberately: nothing depends on it, so a
      # failure names a permission on a deployment that is otherwise complete.
      - name: Ask the app's own identity whether it can store what the product stores
        run: bash ops/scripts/deploy_selfcheck.sh
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          REGISTRY: ${{ steps.infra.outputs.registry }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Say where it is
        run: |
          # One redirect rather than three (shellcheck SC2129). The workflow lint
          # in ci.yml runs shellcheck over every `run:` block now, and a lint with
          # a standing exception is a lint people learn to scroll past.
          {
            echo "### Deployed \`${IMAGE_TAG:0:12}\` to dev"
            echo ""
            echo "- ${{ steps.apps.outputs.web_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
