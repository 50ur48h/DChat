# CI v1 (plan §4.1, WP0.5). It grows with the phases — Phase 1 adds a Postgres
# service for the migration tests, Phase 5 a `test.dal` step with its own
# coverage gate, Phase 9 the eval harness.
#
# `hygiene`, `api` and `web` are the required status checks on `main`, so they
# must ALWAYS report. Path filtering therefore gates the *steps* inside a job,
# never the job itself: a skipped job never reports its context and would leave
# every docs-only PR permanently "Expected — waiting for status" (DECISIONS D-007).

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      connectors: ${{ steps.filter.outputs.connectors }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'ops/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            connectors:
              - 'apps/api/src/dataagent/connectors/**'
              - 'apps/api/src/dataagent/dal/**'
              - 'apps/api/tests/connectors/**'
              - 'ops/seed/seed_pizza_mssql.sql'
              - 'ops/scripts/seed_mssql.sh'
              - '.github/workflows/ci.yml'

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Every TODO has a backlog ID
        run: bash scripts/check_todos.sh
      # Runs before the check it tests, so a guard that has stopped catching
      # anything fails loudly instead of passing everything (B-019).
      - name: The STATUS guard still catches a gutted file
        run: bash scripts/check_status.sh --selftest
      - name: STATUS.md keeps its checklist and its signed-off work
        env:
          # On a PR, what the branch is proposing to change. On a push to main,
          # the commit before it — comparing a ref with itself proves nothing.
          STATUS_BASE_REF: >-
            ${{ github.event_name == 'pull_request'
                && format('origin/{0}', github.base_ref)
                || 'HEAD^' }}
        run: bash scripts/check_status.sh
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Seed truths match the generator
        run: make check.truths

  api:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.api }}
      # Migration and isolation tests need a real server. REQUIRE_DB turns their
      # local "skip when nothing is reachable" into a hard failure here — a
      # silently skipped RLS proof would be worse than having no proof at all.
      # Owner role: migrations and test-database creation.
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
      # The unprivileged role the RLS proof suite connects as. Only the username
      # and password are read from this; each test builds its own database name.
      APP_DATABASE_URL: postgresql+asyncpg://dataagent_app:apptest@localhost:5432/postgres
      REQUIRE_DB: "1"
      # This job measures everything except the SQL Server connector, which it
      # cannot reach. Its half is kept under its own name and combined with the
      # mssql job's half in `coverage` below (B-016).
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.api
    services:
      # pgvector, not plain postgres: revision 0001 creates the vector extension.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: env.RUN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        if: env.RUN == 'true'
        run: uv sync --locked --directory apps/api
      - name: Lint, typecheck, test
        if: env.RUN == 'true'
        run: make lint.api lint.seed typecheck.api test.api
      # Its own step so the tenant-isolation proof is a named signal in the log
      # rather than a line inside a larger run. `pytest -m rls_proof` exits 5 if
      # it collects nothing, so a deleted or renamed marker fails the build
      # instead of quietly testing nothing. REQUIRE_DB=1 above means these
      # cannot skip either.
      - name: Tenant isolation proof (may never be skipped)
        if: env.RUN == 'true'
        run: make test.rls
      # Its own step, and its own gate, for the same reason the RLS proof has
      # one: the DAL is the security boundary (plan §4.4), and a number that
      # only exists inside a larger total is one nobody looks at. `pytest`
      # exits 5 if it collects nothing, so a deleted suite fails the build
      # rather than passing with no tests.
      - name: DAL suite and its coverage gate
        if: env.RUN == 'true'
        env:
          # Its own data file. Without this it writes to COVERAGE_FILE like
          # everything else in the job and replaces the whole suite's shard with
          # a DAL-only one — which is not an error here, where the gate still
          # passes, but drops the combined total from 96% to 63% in a job that
          # cannot see why. This file is not uploaded; the gate is enforced
          # where it is measured.
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.dal-gate
        run: make test.dal
      - name: Keep this job's half of the coverage data
        if: env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: .coverage.api
          retention-days: 1
          # Coverage data files start with a dot, and upload-artifact skips
          # hidden files unless told otherwise — silently, leaving `coverage`
          # with nothing to combine and a number that looks fine.
          include-hidden-files: true
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No changes under apps/api or ops — skipping."

  # The second dialect, against a real SQL Server (WP3.3).
  #
  # Unlike `api` and `web` this job carries a job-level `if`, and the difference
  # is deliberate rather than a lapse from D-007: those two are *required* status
  # checks, so they must always report, while this one is not — a job that never
  # runs simply never reports, and nothing waits on it. Gating the steps instead
  # would start a 1.5 GB service container on every docs-only PR to then skip
  # everything inside it.
  mssql:
    needs: changes
    if: needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-latest
    # The heaviest job here, and the only one that installs from a third-party
    # apt repository — so it is the one that can hang on somebody else's mirror.
    # It did, on #71: `apt-get update` sat on azure.archive.ubuntu.com for 32
    # minutes and would have run to GitHub's 360-minute default. A ceiling turns
    # that into a red job in a quarter of an hour, which is a thing a person can
    # act on.
    timeout-minutes: 20
    env:
      # A throwaway for a container that lives for one job and listens on
      # localhost. It still has to satisfy SQL Server's password policy.
      MSSQL_SA_PASSWORD: Ci_only_password_1
      MSSQL_PIZZA_READONLY_PASSWORD: Ci_only_readonly_1
      MSSQL_HOST: localhost
      MSSQL_PORT: "1433"
      MSSQL_DB: pizza
      MSSQL_PIZZA_READONLY_USER: pizza_readonly
      # The connector suite skips when no server is reachable, which is right on
      # a laptop and wrong here: this job exists to run it.
      REQUIRE_MSSQL: "1"
      # Postgres fixtures are not part of this job, so the shared conftest must
      # be allowed to skip them rather than failing on a missing DATABASE_URL.
      REQUIRE_DB: "0"
      # This is the only job that can execute connectors/sqlserver.py, so it is
      # the only job whose measurement of it means anything (B-016).
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.mssql
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci_only_password_1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_only_password_1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # The same script the image uses, so the driver install is exercised on
      # every connector change rather than only when an image is rebuilt.
      - name: Install the SQL Server ODBC driver
        # Its own, tighter ceiling: the job's 20 minutes would be spent here and
        # report "the job timed out", which says nothing about which step. This
        # says the driver install is what hung.
        timeout-minutes: 8
        run: sudo KEEP_BUILD_TOOLS=1 sh apps/api/docker/install-odbc.sh
      - name: Install
        run: uv sync --locked --directory apps/api
      # -i so the redirected file becomes the container's stdin; sqlcmd reads
      # from it when given neither -Q nor -i of its own.
      - name: Seed the SQL Server fixture
        run: |
          docker exec -i \
            -e RO_PASSWORD="$MSSQL_PIZZA_READONLY_PASSWORD" \
            "${{ job.services.mssql.id }}" \
            sh -c 'exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -v ReadonlyPassword="$RO_PASSWORD"' \
            < ops/seed/seed_pizza_mssql.sql
      - name: Connector tests (may not skip here)
        run: uv run --directory apps/api pytest tests/connectors -q --cov
      - name: Keep this job's half of the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mssql
          path: .coverage.mssql
          retention-days: 1
          include-hidden-files: true

  # The API's coverage number, assembled from the jobs that each measured part
  # of it (B-016). Splitting the suite by which database a job can reach is
  # right; letting either half report the total as if it were the whole is not.
  #
  # `always()` for the D-007 reason: a job that is skipped never reports, and a
  # number that only sometimes appears is one nobody notices going missing. The
  # mssql shard is conditional, so this must not be conditional on it — the
  # script says which shards it found and what their absence means.
  # The twenty golden questions, against a real seed, on every PR (plan WP9.2b).
  #
  # Its own job because it needs a state nothing else does — a seeded pizza
  # database, an organization, a registered read-only source and a built catalog
  # — and because a suite that shares a database with the unit tests would be
  # measuring their leftovers. It provisions all of it from nothing, which is
  # what makes the evals a *required check* rather than twenty questions that run
  # when somebody remembers.
  #
  # FakeLLM only, and deliberately: the SQL comes from `golden.yaml`, so this
  # tests the catalog grounding, the DAL, the critic and the composer rather than
  # a model's prose. It costs nothing, it cannot flake on a provider, and it
  # gives the same answer every time. The model's own quality is
  # `nightly-evals.yml`'s business, where it can spend money and fail without
  # blocking a merge.
  evals:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.api }}
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/dataagent
      APP_DATABASE_URL: postgresql+asyncpg://dataagent_app:apptest@localhost:5432/dataagent
      APP_DB_PASSWORD: apptest
      # The fixture's own database, on the same server. Registered with the
      # read-only login `make seed` creates, never the owner: `readonly_verified`
      # is part of what these evals exercise.
      SEED_PIZZA_HOST: localhost
      SEED_PIZZA_PORT: "5432"
      SEED_PIZZA_DB: pizza
      SEED_PIZZA_USER: postgres
      SEED_PIZZA_PASSWORD: test
      SEED_PIZZA_READONLY_USER: pizza_readonly
      SEED_PIZZA_READONLY_PASSWORD: evalsreadonly
      # Both databases are on this runner, so TLS is not negotiable here in the
      # way it is anywhere else — declared explicitly rather than left to a
      # default, so nothing about production leaks in from an omission.
      TLS_LOCAL_HOSTS: localhost
      SECRETS_BACKEND: local
      LOCAL_SECRETS_PATH: ${{ github.workspace }}/ops/.secrets/evals.json
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: env.RUN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        if: env.RUN == 'true'
        run: uv sync --locked --directory apps/api
      - name: A key for the local secrets store
        if: env.RUN == 'true'
        run: |
          mkdir -p ops/.secrets
          echo "LOCAL_SECRETS_KEY=$(uv run --directory apps/api python -c             'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"             >> "$GITHUB_ENV"
      - name: The platform database
        if: env.RUN == 'true'
        run: |
          psql "postgresql://postgres:test@localhost:5432/postgres"             -c "CREATE DATABASE dataagent"
          uv run --directory apps/api alembic upgrade head
          psql "postgresql://postgres:test@localhost:5432/dataagent"             -c "ALTER ROLE dataagent_app WITH LOGIN PASSWORD 'apptest'"
      # The same generator `make seed` runs, so the numbers here are the numbers
      # in truths.json — which is the whole basis of every expected value.
      - name: The pizza fixture
        if: env.RUN == 'true'
        run: |
          psql "postgresql://postgres:test@localhost:5432/postgres"             -c "CREATE DATABASE pizza"
          uv run ops/seed/seed_pizza.py
      - name: An organization, a registered source and its catalog
        if: env.RUN == 'true'
        run: |
          uv run --directory apps/api python ../../ops/evals/provision.py | tee /tmp/provision.log
          grep '^EVALS_ORG_ID=' /tmp/provision.log >> "$GITHUB_ENV"
      - name: The twenty golden questions
        if: env.RUN == 'true'
        run: make evals
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No API or ops changes; the evals did not need to run."

  coverage:
    needs: [api, mssql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Collect what each job measured
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: apps/api/coverage-data
      - name: Combine the shards and apply the floor
        run: bash scripts/coverage_report.sh

  web:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: env.RUN == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        if: env.RUN == 'true'
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Lint, typecheck, test
        if: env.RUN == 'true'
        run: make lint.web typecheck.web test.web
      - name: Build
        if: env.RUN == 'true'
        run: pnpm --dir apps/web build
      # A real browser, because a jsdom test passed against code the browser
      # visibly broke on (B-044). Chromium only, against a stub API, so this
      # needs no compose stack, no database and no key.
      - name: Install Chromium
        if: env.RUN == 'true'
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Browser smoke
        if: env.RUN == 'true'
        run: make test.web.e2e
      - name: Keep the trace of a failure
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No changes under apps/web — skipping."

  # Proves both images still build. Pushing them arrives with Phase 12.
  docker:
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build --target prod --build-arg GIT_SHA=${{ github.sha }} -t api:ci apps/api
      - name: Build the web image
        run: docker build --target prod -t web:ci apps/web
