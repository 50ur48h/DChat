[project]
name = "dataagent"
version = "0.1.0"
description = "AI-native data analysis platform — API, agent runtime, DAL, connectors"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # orjson is deliberately absent — see DECISIONS D-005.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent"]

# ---------------------------------------------------------------------------
# ruff — lint + format. Line length matches .editorconfig.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ASYNC",# async correctness — this codebase is async end to end
    "S",    # bandit security rules
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are the point of a test
]

[tool.ruff.lint.isort]
known-first-party = ["dataagent"]

# ---------------------------------------------------------------------------
# pyright — strict. The DAL is a security boundary; types are part of the guard.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "rls_proof: tenant-isolation proof tests — may never be skipped (plan §4.4)",
]

[tool.coverage.run]
source = ["src/dataagent"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
