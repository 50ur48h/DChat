[alembic]
script_location = src/dataagent/db/alembic
prepend_sys_path = src
path_separator = os

# Left empty on purpose. env.py resolves the DSN from ALEMBIC_DATABASE_URL, then
# from settings — keeping it out of this file avoids both committing a
# credential and Alembic's %-interpolation mangling passwords.
sqlalchemy.url =

# Zero-padded, ordered filenames: 0001_core_tables.py, 0002_rls.py, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
