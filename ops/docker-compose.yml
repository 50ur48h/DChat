# Local development stack (plan WP0.4, architecture Part 9.2).
#
# Always drive this through the Makefile — `make up`, `make down`, `make logs`.
# The targets pass `--env-file .env` from the repository root; relative paths
# below resolve against this file's directory, which is the compose project dir.
#
# No credentials live in this file. Every password comes from the root `.env`,
# which is gitignored; `.env.example` documents each one (plan §1.4).

name: dataagent

services:
  # The platform's own database: tenants, catalog, runs, events, pgvector.
  platform-pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME:-dataagent}
      POSTGRES_USER: ${PLATFORM_DB_USER:-dataagent}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
    ports:
      - "${PLATFORM_DB_PORT:-5432}:5432"
    volumes:
      - platform-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${PLATFORM_DB_USER:-dataagent} -d ${PLATFORM_DB_NAME:-dataagent}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A stand-in for a *customer's* database. The platform reaches it read-only,
  # exactly as it will reach a real one. Deliberately has no order_items table.
  seed-pizza-pg:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SEED_PIZZA_DB:-pizza}
      POSTGRES_USER: ${SEED_PIZZA_USER:-pizza}
      POSTGRES_PASSWORD: ${SEED_PIZZA_PASSWORD:?set SEED_PIZZA_PASSWORD in .env}
    ports:
      - "${SEED_PIZZA_PORT:-6543}:5432"
    volumes:
      - seed-pizza-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEED_PIZZA_USER:-pizza} -d ${SEED_PIZZA_DB:-pizza}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A second stand-in customer database, and a deliberately *unlike* one: the
  # pizza fixture is a schema this project designed, so it flatters every part of
  # the product that reads a schema. This one is a real F&B operator's warehouse
  # loaded verbatim from the SQLite file they shipped — star schema, `v_*` views,
  # bridge and map and meta tables, and eight tables that are empty because the
  # business does not collect that yet. `make seed.fnb` fills it.
  seed-fnb-pg:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SEED_FNB_DB:-fnb}
      POSTGRES_USER: ${SEED_FNB_USER:-fnb}
      POSTGRES_PASSWORD: ${SEED_FNB_PASSWORD:?set SEED_FNB_PASSWORD in .env}
    ports:
      - "${SEED_FNB_PORT:-6544}:5432"
    volumes:
      - seed-fnb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEED_FNB_USER:-fnb} -d ${SEED_FNB_DB:-fnb}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ../apps/api
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      ENV: local
      GIT_SHA: ${GIT_SHA:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Explicit, because the default is the stricter mode.
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dataagent-api}
      DEV_ISSUER_URL: ${DEV_ISSUER_URL:-http://localhost:8000/dev}
      # Where to fetch the provider's discovery document. The expected `iss`
      # comes from that document, not from configuration (DECISIONS D-009).
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-}
      # The optional pin for the expected `iss`. Normally unset — the issuer is
      # read from the discovery document — but a deployment that pins it on the
      # host and not here would validate tokens differently in the two places,
      # which is the worst kind of auth difference to debug.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      # Built from the same parts as the root DATABASE_URL, but reaching the
      # database over the compose network rather than a published host port.
      DATABASE_URL: postgresql+asyncpg://${PLATFORM_DB_USER:-dataagent}:${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}@platform-pg:5432/${PLATFORM_DB_NAME:-dataagent}
      # What the request path actually connects as: no superuser, no BYPASSRLS.
      APP_DATABASE_URL: postgresql+asyncpg://dataagent_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@platform-pg:5432/${PLATFORM_DB_NAME:-dataagent}
      # Data-source credentials (DECISIONS D-001). Defaulted rather than
      # required: the API must still boot and answer /healthz without a key —
      # only the routes that store credentials refuse, and they say why.
      SECRETS_BACKEND: ${SECRETS_BACKEND:-local}
      LOCAL_SECRETS_KEY: ${LOCAL_SECRETS_KEY:-}
      LOCAL_SECRETS_PATH: /app/ops/.secrets/secrets.json
      # Encryption to customer databases (B-013). Any address that is not on this
      # machine must use TLS; these two names are databases *in this network*,
      # serving no certificate that any name could match, so they are declared
      # local here — in the file that creates them — rather than in application
      # defaults that would follow the image into a deployment.
      TLS_LOCAL_HOSTS: ${TLS_LOCAL_HOSTS:-seed-pizza-pg,seed-fnb-pg,mssql}
      TLS_MODE: ${TLS_MODE:-require}
      TLS_MODE_LOCAL: ${TLS_MODE_LOCAL:-prefer}
      TLS_CA_FILE: ${TLS_CA_FILE:-}
      # The model configuration, which this container had none of until Phase 7
      # put a chat UI in front of it. Runs happen *inside the API process*
      # (D-021), so a key that exists only in the developer's shell reaches the
      # smoke script and never the product: every question asked in the browser
      # failed with "LLM_MODELS names no models for provider 'openai'".
      #
      # All defaulted to empty rather than required, for the same reason
      # SECRETS_BACKEND is: the API must still boot and answer /healthz on a
      # machine with no key. What refuses without one is the run, and it says so.
      # No secret is written here — these read from the developer's local .env,
      # which is gitignored, and .env.example documents them (plan §1.4).
      LLM_PROVIDERS: ${LLM_PROVIDERS:-}
      LLM_MODELS: ${LLM_MODELS:-}
      LLM_ROLE_MAP: ${LLM_ROLE_MAP:-}
      LLM_PRICES: ${LLM_PRICES:-}
      LLM_RUN_COST_LIMIT_USD: ${LLM_RUN_COST_LIMIT_USD:-}
      # What a run does when the cap is on and a model has no price. The answer
      # differs — refuse, or proceed unmetered — so a developer who set it on the
      # host and watched the container do the other thing would be debugging the
      # policy rather than their configuration.
      LLM_REFUSE_UNPRICED_WHEN_CAPPED: ${LLM_REFUSE_UNPRICED_WHEN_CAPPED:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The embedding model, for exactly the reason the block above exists
      # (B-086). Retrieval happens *inside the API process*, so a model named
      # only in the developer's shell reaches the eval harness and never the
      # product: the container built no embedder, every card and document stayed
      # lexical, and D-031 degraded the search on every question asked in the
      # browser while the same question answered fully from the host. Empty is a
      # legitimate deployment — it costs the vector arm and the result says so.
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-}
      EMBEDDINGS_BATCH: ${EMBEDDINGS_BATCH:-}
      # The DAL's caps, which decide what a query is allowed to cost the
      # customer's database. Tuned on the host and not passed, they were a
      # setting that moved the tests and left the product alone (B-090).
      DAL_MAX_ROWS: ${DAL_MAX_ROWS:-}
      DAL_TIMEOUT_SECONDS: ${DAL_TIMEOUT_SECONDS:-}
      # How long a stored result lives. A promise made to the customer, so the
      # container has to make the same one the developer thinks it is making.
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Source only: never mount over /app/.venv, which is built into the image.
      - ../apps/api/src:/app/src
      # The encrypted secrets file, on the host and gitignored, so `make down`
      # does not throw away registered data sources — and so the ciphertext is
      # something a developer can actually look at.
      - ../ops/.secrets:/app/ops/.secrets
      # Where query results are written (ARTIFACTS_PATH, default ops/artifacts).
      # Unmounted, `/app/ops` is not writable and every successful query died
      # after running, with `Permission denied` — the query had already read the
      # customer's data, so this failed at the last possible moment. Gitignored,
      # and on the host on purpose: WP5.2b's central claim is that no unmasked
      # value reaches a stored file, and that is only checkable if the files are
      # somewhere a person can grep.
      - ../ops/artifacts:/app/ops/artifacts
    depends_on:
      platform-pg:
        condition: service_healthy
      seed-pizza-pg:
        condition: service_healthy
      seed-fnb-pg:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ../apps/web
      target: dev
    environment:
      # The browser resolves these, not the container, so they are host URLs.
      # NEXT_PUBLIC_* is inlined into the bundle; in this dev target `next dev`
      # reads them at runtime, so a change here needs only a restart.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
      NEXT_PUBLIC_ENTRA_AUTHORITY: ${NEXT_PUBLIC_ENTRA_AUTHORITY:-}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_CLIENT_ID:-}
      NEXT_PUBLIC_API_SCOPE: ${NEXT_PUBLIC_API_SCOPE:-}
      # Bind mounts on Windows and macOS do not deliver inotify events.
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web/src:/app/src
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # `next dev` compiles on first request, so this probe is also what warms
      # the page — without it `make up` returns before anything is servable.
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Started on demand (`make up.mssql`): the image is ~1.5 GB and idles on ~2 GB
  # of RAM, so it stays out of the default `make up`. `make seed.mssql` fills it.
  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Defaulted, not required. Compose resolves `${VAR:?}` for every service
      # in the file regardless of profiles, so a required variable here would
      # make plain `make up` fail over a container it never starts.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_dev_only_1}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd ships inside the image, at a path that moved in 2022. -C trusts
      # the server's self-signed certificate, which is the one it generates for
      # itself: this probe is the container talking to itself about whether it
      # has finished starting, not a statement about how anyone else connects.
      test:
        ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      # SQL Server takes its time on first boot, and a container reported
      # unhealthy before it has ever been healthy is indistinguishable from a
      # broken one.
      start_period: 60s

volumes:
  platform-pg-data:
  seed-pizza-data:
  seed-fnb-data:
  mssql-data:
